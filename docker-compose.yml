name: git-event-hub

services:
  app:
    build:
      context: apps/server
      dockerfile: Dockerfile
    env_file:
      - path: apps/server/.env
        required: false
    environment:
      HUB_CONFIG: /etc/git-event-hub/${HUB_CONFIG_FILE:-example.yaml}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/git-event-hub?sslmode=disable
    # The directory is mounted, not the file, so an edit on the host reaches
    # the container and the hub reloads it.
    volumes:
      - ./apps/server/config:/etc/git-event-hub:ro
    ports:
      - "127.0.0.1:${HUB_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: git-event-hub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d git-event-hub"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
