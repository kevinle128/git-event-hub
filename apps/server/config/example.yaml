# git-event-hub configuration. Every secret is named by the environment
# variable that holds it; no secret value belongs in this file.
# The file reloads while the hub runs (except server, database and log).

server:
  host: 0.0.0.0
  port: 8080
  maxBodyBytes: 26214400 # 25 MiB

database:
  urlEnv: DATABASE_URL # postgres://user:pass@host:5432/db?sslmode=disable

log:
  level: info   # debug, info, warn, error
  format: json  # json or console

api:
  # Bearer token for /api/* and /metrics. When the variable is empty, those
  # endpoints refuse every request.
  tokenEnv: HUB_API_TOKEN

# One entry per forge. The name is the URL path: POST /hooks/<name>.
sources:
  - name: github            # the GitHub App webhook
    type: githubapp
    secretEnv: GITHUB_WEBHOOK_SECRET
  - name: gitlab            # the GitLab group webhook
    type: gitlab
    secretEnv: GITLAB_WEBHOOK_TOKEN # several tokens may be separated by commas
    # Only these repositories may speak through this source. Give each GitLab
    # group webhook its own source entry, token and repos, so one token cannot
    # speak for another group. Empty means every repository.
    repos: ["vtc/**"]

defaults:
  # Event kinds the hub accepts at all; empty means all.
  kinds: [opened, pushed, ci.finished, review.finished, comment, conflict, merged, closed]
  # Only comments of these accounts become comment or review.finished events.
  # "*[bot]" matches every GitHub App account; a person cannot register a
  # login with "[". A GitLab bot account must be listed by its exact name.
  # A pattern made only of "*" is refused. Values to confirm with the owner.
  commentAuthors: ["*[bot]", "ocr-review-bot"]
  # Only comments of these accounts can carry a review block and become
  # review.finished events. With an empty list every review.finished event is
  # dropped. Values to confirm with the owner: the OCR review bot accounts
  # (GitHub App and GitLab user).
  reviewAuthors: ["kevinle128-ocr[bot]", "ocr-review-bot"]
  delivery:
    batchSize: 20
    timeout: 10s
    backoff: {initial: 2s, max: 5m}
    maxAttempts: 20   # then the event is parked as failed
    maxAge: 72h       # then the hub gives up on the event

retention:
  receiptsDays: 14
  eventsDays: 30
  indexDays: 60

subscribers:
  # A pull request or merge request opened by one of the identities belongs
  # to the subscriber, and so does every later event of it.
  - id: kevin
    identities:
      github: [kevinle128]
      gitlab: [kevin.le]
    sinks:
      # One sink per OMB connector. The URL path is the OMB connector
      # instance; connector is the source.connector value and fixes the
      # forge, so filter.providers must name that forge only.
      - name: omb-github
        type: omb
        connector: github-event
        url: https://omb.tailnet.example:8451/events/github-event
        secretEnv: OMB_KEVIN_GITHUB_SECRET
        filter:
          providers: [github]
      - name: omb-gitlab
        type: omb
        connector: gitlab-event
        url: https://omb.tailnet.example:8451/events/gitlab-event
        secretEnv: OMB_KEVIN_GITLAB_SECRET
        filter:
          providers: [gitlab]

  - id: lan
    identities:
      github: [lan-vtc]
      gitlab: [lan.nguyen]
    filter:
      repos:
        exclude: ["**/sandbox-*"]
    # Also follow every GitHub pull request of these repositories, whoever
    # opened it. GitLab merge requests go only to their author.
    subscriptions:
      - repos: ["kevinle128/git-event-hub"]
        kinds: [opened, merged, closed]
    sinks:
      - name: hermes
        type: webhook
        url: https://hermes.example/hooks/pr-events
        mode: batch          # single (default) or batch
        auth:
          type: hmac         # none, hmac or bearer
          secretEnv: HERMES_LAN_SECRET
        filter:
          kinds: [ci.finished, review.finished, merged]
        delivery:
          maxAttempts: 10
